# Publishes the gateway images built from the latest merged code.
#
# Each merge that changes the gateway builds the gateway-controller, gateway-runtime and
# gateway-builder images and pushes them to the registry that holds the released images, under
# two tags:
#   latest          moves with every merge
#   main-<sha>      the merged commit, never moved
# Other repositories (for example gateway-controllers) pull the latest tag the same way they pull
# a released one, so they never build gateway source themselves.

name: Gateway Latest Image

# TEMP: this comment exists only to push the workflow file again and retrigger it on main-test.
# Remove this commit before the upstream pull request.

on:
  # TEMP: run the build when a pull request that changes the gateway is merged into the fork's
  # main-test branch. The push trigger below did not start a run on this branch. Remove this
  # trigger before the upstream pull request.
  pull_request:
    branches:
      - main-test
    types: [closed]
    paths:
      - 'gateway/**'
      - 'common/**'
      - 'httpkit/**'
      - 'sdk/**'
      - 'sdk-python/**'
      - '.github/workflows/gateway-latest-image.yml'
  push:
    # TEMP: the fork's test branch stands in for main while this workflow is proven. Use `main`
    # in the upstream pull request.
    branches:
      - main-test
    paths:
      - 'gateway/**'
      - 'common/**'
      - 'httpkit/**'
      - 'sdk/**'
      - 'sdk-python/**'
      - '.github/workflows/gateway-latest-image.yml'
  workflow_dispatch:

# A newer merge supersedes an older one, so latest never moves back to an older commit.
concurrency:
  group: gateway-latest-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: Build and push the latest gateway images
    # A pull request that is closed without merging builds nothing.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # For a merged pull request this is the commit the merge created on the base branch.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Resolve the image registry and tag
        id: image
        env:
          MERGE_COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          # The registry follows the repository owner, so the same workflow publishes to
          # ghcr.io/wso2/api-platform upstream and to the owner's namespace in a fork. GHCR
          # needs a lowercase name.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "registry=ghcr.io/${owner}/api-platform" >> "$GITHUB_OUTPUT"
          sha="${MERGE_COMMIT_SHA:-$GITHUB_SHA}"
          echo "tag=main-${sha::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
        with:
          install: true
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The upstream release workflows push with the bot token. A fork has no such secret and
          # pushes with its own token.
          password: ${{ secrets.API_PLATFORM_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      # The gateway Makefile pushes <registry>/<image>:<VERSION> and, unless PUSH_LATEST=false,
      # <registry>/<image>:latest in the same build, so one run publishes both tags.
      - name: Build and push the multi-arch gateway images
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
          TAG: ${{ steps.image.outputs.tag }}
        run: make -C gateway build-and-push-multiarch VERSION="$TAG" DOCKER_REGISTRY="$REGISTRY"

      - name: Verify the pushed images
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "### Gateway images"
            echo
            echo "| Image | Tags | Platforms |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for name in gateway-controller gateway-runtime gateway-builder; do
            latest_digest="$(docker buildx imagetools inspect "$REGISTRY/$name:latest" --format '{{.Manifest.Digest}}')"
            tag_digest="$(docker buildx imagetools inspect "$REGISTRY/$name:$TAG" --format '{{.Manifest.Digest}}')"
            if [[ "$latest_digest" != "$tag_digest" ]]; then
              echo "::error::$name: latest ($latest_digest) is not $TAG ($tag_digest)"
              exit 1
            fi
            platforms="$(docker buildx imagetools inspect "$REGISTRY/$name:latest" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')"
            for platform in linux/amd64 linux/arm64; do
              if [[ " $platforms" != *" $platform "* ]]; then
                echo "::error::$name is missing $platform (has: $platforms)"
                exit 1
              fi
            done
            echo "| \`$REGISTRY/$name\` | \`latest\`, \`$TAG\` | $platforms |" >> "$GITHUB_STEP_SUMMARY"
          done
